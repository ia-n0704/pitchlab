services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pitchlab
      POSTGRES_PASSWORD: pitchlab
      POSTGRES_DB: pitchlab
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitchlab"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      POSTGRES_DSN: postgresql+psycopg://pitchlab:pitchlab@db:5432/pitchlab
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: local
      LOCAL_UPLOADS_DIR: /app/uploads
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-5}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    volumes:
      - uploads:/app/uploads
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=1
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      POSTGRES_DSN: postgresql+psycopg://pitchlab:pitchlab@db:5432/pitchlab
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: local
      LOCAL_UPLOADS_DIR: /app/uploads
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-5}
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
